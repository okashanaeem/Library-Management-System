{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
    <h2 class="page-title mb-4">Dashboard</h2>
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card-panel p-4">
                <div class="text-primary mb-2"><i class="bi bi-book-fill fs-3"></i></div>
                <h3 class="mb-0">{{ total_books }}</h3>
                <p class="text-muted mb-0">Total Books</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-panel p-4">
                <div class="text-success mb-2"><i class="bi bi-people-fill fs-3"></i></div>
                <h3 class="mb-0">{{ total_members }}</h3>
                <p class="text-muted mb-0">Total Members</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-panel p-4">
                <div class="text-warning mb-2"><i class="bi bi-arrow-left-right fs-3"></i></div>
                <h3 class="mb-0">{{ active_issues }}</h3>
                <p class="text-muted mb-0">Active Issues</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-panel p-4">
                <div class="text-danger mb-2"><i class="bi bi-exclamation-triangle-fill fs-3"></i></div>
                <h3 class="mb-0 text-danger">{{ overdue_issues }}</h3>
                <p class="text-muted mb-0">Overdue Books</p>
            </div>
        </div>
    </div>
{% endblock %}
