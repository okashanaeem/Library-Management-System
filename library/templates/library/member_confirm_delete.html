{% extends "base.html" %}
{% block title %}Delete Member{% endblock %}
{% block content %}
    <h2 class="page-title mb-4">Delete Member</h2>
    <div class="card-panel p-4" style="max-width: 500px;">
        <p>Are you sure you want to delete <strong>{{ member.name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, Delete</button>
            <a href="{% url 'member_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
