{% extends "base.html" %}
{% block title %}Members{% endblock %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-1">
        <h2 class="page-title mb-0">Members</h2>
        <a href="{% url 'member_add' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Member</a>
    </div>
    <p class="page-subtitle mb-4">Manage registered library members</p>

    <div class="card-panel p-4">
        <form method="get" class="mb-3 search-box" style="max-width: 400px;">
            <i class="bi bi-search"></i>
            <input type="text" name="q" value="{{ query }}" class="form-control" placeholder="Search by name or email...">
        </form>
        <table class="table align-middle mb-0">
            <thead>
                <tr><th>Name</th><th>Email</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for member in members %}
                <tr>
                    <td class="fw-semibold">{{ member.name }}</td>
                    <td>{{ member.email }}</td>
                    <td>
                        <a href="{% url 'member_edit' member.pk %}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                        <a href="{% url 'member_delete' member.pk %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center text-muted py-4">No members yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
