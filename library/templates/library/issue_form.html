{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <h2 class="page-title mb-4">{{ title }}</h2>
    <div class="card-panel p-4" style="max-width: 550px;">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Issue Book</button>
            <a href="{% url 'issue_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
