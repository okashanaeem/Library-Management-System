{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <h2 class="page-title mb-4">{{ title }}</h2>
    <form method="post" class="card-panel p-4"></form>
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Issue Book</button>
        <a href="{% url 'issue_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
