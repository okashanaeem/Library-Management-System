<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --primary-light: #eef2ff;
            --sidebar-bg: #171432;
            --sidebar-bg-2: #211c47;
            --bg-light: #f4f5fa;
            --text-muted: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: #1f2430;
        }
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 1.75rem;
            z-index: 100;
        }
        .sidebar .brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.15rem;
            padding: 0 1.5rem 1.75rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 1rem;
        }
        .sidebar .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .sidebar-section-label {
            color: #6d6795;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0 1.5rem;
            margin: 1rem 0 0.5rem;
        }
        .sidebar a.nav-link {
            color: #b3aed6;
            padding: 0.65rem 1.5rem;
            font-weight: 500;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 11px;
            border-left: 3px solid transparent;
            transition: 0.15s;
            margin: 0.1rem 0;
        }
        .sidebar a.nav-link i { font-size: 1.05rem; width: 18px; text-align: center; }
        .sidebar a.nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }
        .sidebar a.nav-link.active {
            color: #fff;
            background: rgba(79,70,229,0.25);
            border-left: 3px solid var(--primary);
        }
        .main-content {
            margin-left: 250px;
            padding: 2.25rem 2.75rem;
            min-height: 100vh;
        }
        .page-title {
            font-weight: 800;
            color: #171432;
            letter-spacing: -0.02em;
        }
        .page-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .card-panel {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(23,20,50,0.06), 0 1px 2px rgba(23,20,50,0.04);
            border: 1px solid #eef0f5;
        }
        .stat-card {
            border-radius: 14px;
            padding: 1.5rem;
            background: #fff;
            border: 1px solid #eef0f5;
            box-shadow: 0 1px 3px rgba(23,20,50,0.05);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(23,20,50,0.08);
        }
        .stat-icon {
            width: 46px;
            height: 46px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 0.9rem;
        }
        .stat-value {
            font-size: 1.85rem;
            font-weight: 800;
            color: #171432;
            line-height: 1;
        }
        .stat-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 0.3rem;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
            padding: 0.55rem 1.15rem;
            border-radius: 9px;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .btn-outline-warning, .btn-outline-danger, .btn-outline-success {
            border-radius: 8px;
        }
        .table thead th {
            background-color: #171432;
            color: #fff;
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border: none;
            padding: 0.85rem 1rem;
        }
        .table thead tr th:first-child { border-top-left-radius: 10px; }
        .table thead tr th:last-child { border-top-right-radius: 10px; }
        .table tbody td {
            padding: 0.85rem 1rem;
            vertical-align: middle;
            border-bottom: 1px solid #f0f1f6;
        }
        .badge { font-weight: 600; padding: 0.4em 0.75em; border-radius: 6px; }
        .form-control, .form-select {
            border-radius: 9px;
            padding: 0.6rem 0.9rem;
            border: 1px solid #e2e4ec;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }
        .form-label { font-weight: 600; font-size: 0.88rem; color: #374151; }
        .search-box {
            position: relative;
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        .search-box input { padding-left: 40px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="{% url 'dashboard' %}" class="brand">
            <span class="brand-icon">📚</span> Library System
        </a>
        <nav class="nav flex-column">
            <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="bi bi-grid-1x2-fill"></i> Dashboard
            </a>
            <div class="sidebar-section-label">Management</div>
            <a href="{% url 'book_list' %}" class="nav-link {% if 'book' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-book-fill"></i> Books
            </a>
            <a href="{% url 'member_list' %}" class="nav-link {% if 'member' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-people-fill"></i> Members
            </a>
            <a href="{% url 'issue_list' %}" class="nav-link {% if 'issue' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-arrow-left-right"></i> Book Issues
            </a>
            <div class="sidebar-section-label">System</div>
            <a href="/admin/" class="nav-link">
                <i class="bi bi-gear-fill"></i> Admin Panel
            </a>
        </nav>
    </div>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
